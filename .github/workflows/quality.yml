name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 24 quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org/ --strict-ssl=true --no-audit --no-fund
      - name: Typecheck, lint, test and build
        run: npm run check
      - name: Verify deterministic demo replays
        run: |
          npm run replay -- evidence/sample-replay.json
          npm run replay -- evidence/world-tour-replay.json
